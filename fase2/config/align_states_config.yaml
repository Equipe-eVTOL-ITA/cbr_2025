# Configuração dos Estados de Alinhamento
# Parâmetros para align_base_state.hpp e align_package_state.hpp

# === Parâmetros Gerais de Alinhamento ===
align_tolerance: 0.1                    # metros - tolerância para considerar alinhado
max_horizontal_velocity: 0.5            # m/s - velocidade máxima horizontal
align_descent_velocity: 0.2             # m/s - velocidade de descida durante alinhamento
detection_timeout: 5.0                  # segundos - timeout para perda de detecção

# === Controladores PID ===
# PID para controle de posição (X e Y)
pid_pos_kp: 1.0
pid_pos_ki: 0.1
pid_pos_kd: 0.05
setpoint: 0.0

# PID para controle de yaw (apenas para packages)
pid_yaw_kp: 2.0
pid_yaw_ki: 0.0
pid_yaw_kd: 0.1

# === Offsets Específicos ===
# Offset para alinhamento com bases (posição da câmera relativa ao centro do drone)
base_align_offset_x: 0.05              # metros - offset frontal da câmera
base_align_offset_y: 0.02              # metros - offset lateral da câmera

# Offset para alinhamento com packages (posição da garra relativa ao centro do drone)
package_align_offset_x: 0.15           # metros - offset frontal da garra
package_align_offset_y: 0.0            # metros - offset lateral da garra

# === Parâmetros Específicos para Bases ===
height_to_ground: 1.0                  # relação entre distância na imagem e altura do solo
mean_base_height: 0.0                  # altura média das bases (z = 0 para solo)

# === Parâmetros Específicos para Packages ===
mean_package_height: 0.1               # altura média dos packages (metros acima do solo)
yaw_align_tolerance: 0.087              # radianos (~5 graus) - tolerância para alinhamento rotacional
max_yaw_rate: 0.5                      # rad/s - velocidade angular máxima

# === Parâmetros do VisionNode ===
# Tópicos de detecção
base_detection_topic: "/base_detector/detections"
package_detection_topic: "/package_detector/detections"

# Habilitação de detectores
enable_base_detection: true
enable_package_detection: true

# Timeout para detecções
vision_timeout: 10.0

# === Estados da Missão ===
package_state: "get_package"           # "get_package" ou "deliver_package"
