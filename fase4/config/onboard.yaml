# Onboard computer configuration for CBR 2025 Fase4

# OAK-D Camera Configuration for FRONTAL depth camera (window detection)
oak:
  ros__parameters:
    # Depth camera configuration (FRONTAL facing for window detection)
    enable_depth: true
    depth_topic: "/depth_camera/compressedDepth"
    depth_fps: 30
    depth_resolution: "720p"
    depth_width: 800
    depth_height: 800
    
    # RGB camera (optional for debugging)
    enable_rgb: false
    rgb_topic: "/depth_camera/rgb/compressed"
    
    # Camera position (frontal)
    camera_position: "front"
    
    # Publishing configuration
    publish_compressed: true
    compression_quality: 80

# Legacy RGB publisher (if needed)
oak_rgb_publisher:
  ros__parameters:
    publish_raw: true
    publish_compressed: false
    width: 800
    height: 800
    fps: 10
    auto_exposure_compensation: 1


# WindowDetector Configuration for Frontal Depth Camera
window_detector:
  ros__parameters:
    # FRONTAL depth camera topics
    image_topic: '/depth_camera/compressedDepth'
    detection_topic: '/window_found'
    centroid_topic: '/centroid'
    threshold_topic: '/threshold'
    
    # Debug mode configuration
    debug_mode: true
    debug_topic: '/telemetry/window_debug/compressed'
    debug_size: 400      # Resize debug images to 400x400 for bandwidth
    debug_quality: 75    # JPEG compression quality

# QRCodeDetector Configuration for Frontal Depth Camera
qr_code_detector:
  ros__parameters:
    # FRONTAL depth camera topics
    image_topic: '/depth_camera/compressedDepth'
    detection_topic: '/vertical_classification'
    qr_string_topic: '/qr_code_string'
    
    # Debug mode configuration  
    debug_mode: true
    debug_topic: '/telemetry/qr_debug/compressed'
    debug_size: 400      # Resize debug images to 400x400 for bandwidth
    debug_quality: 75    # JPEG compression quality

telemetry_recorder:
  ros__parameters:
    recording:
      enable: false
      max_duration_minutes: 10
      max_file_size_mb: 1000
      include_images: false
      recording_formats: ["rosbag"]
      output_directory: "~/frtl_2025_ws/flight_logs/onboard"
      autosave_time: 300.0  # Auto-save every 5 minutes