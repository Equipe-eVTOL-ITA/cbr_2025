# Vision Configuration for CBR 2025 Fase4
# Configuration for window detection using frontal depth camera

# VisionNode Configuration for Fase4
fase4_vision:
  ros__parameters:
    # Window and QR detection timeouts
    timeout: 10.0
    
    # Detection topic configuration for fase4
    enable_base_detection: false
    enable_package_detection: false
    enable_window_detection: true
    enable_qr_detection: true
    
    # FRONTAL depth camera parameters (for window detection)
    fx: 600.0
    fy: 600.0
    cx: 400.0
    cy: 400.0
    image_width: 800
    image_height: 800
    
    # Distortion parameters
    dist_k1: 0.0
    dist_k2: 0.0
    dist_p1: 0.0
    dist_p2: 0.0
    dist_k3: 0.0
    
    # FRONTAL camera extrinsics (facing forward for window detection)
    camera_roll: 0.0
    camera_pitch: 0.0      # Level camera (not downward facing)
    camera_yaw: 0.0
    camera_tx: 0.1         # Slightly forward from center
    camera_ty: 0.0
    camera_tz: 0.0
    
    # Window detection parameters
    known_window_height: 1.5   # Expected window height in meters
    known_window_width: 1.0    # Expected window width in meters
    
    # Coordinate mode for window detection
    bbox_is_normalized: true
    
    # Ground plane projection
    mean_base_height: 0.0
    accurate_project_to_ground: false
    accurate_ground_z: 0.0

# WindowDetector Configuration for Frontal Depth Camera
window_detector:
  ros__parameters:
    # FRONTAL depth camera topics (from Gazebo bridge)
    depth_topic: "/depth_camera/image_raw"
    use_compressed: false  # Gazebo publishes raw images
    detection_topic: "/window_found"
    centroid_topic: "/centroid"
    threshold_topic: "/threshold"
    
    # Window detection parameters
    detection_threshold: 100      # Depth threshold for window detection
    min_window_area: 1000        # Minimum window area in pixels
    max_window_area: 50000       # Maximum window area in pixels
    window_aspect_ratio_min: 0.5 # Minimum aspect ratio for windows
    window_aspect_ratio_max: 3.0 # Maximum aspect ratio for windows
    
    # Morphological operations
    morph_kernel_size: 5         # Kernel size for morphological operations
    morph_iterations: 2          # Number of morphological iterations
    
    # Debug mode
    debug_mode: true
    debug_topic: "/window_debug/compressed"

# QRCodeDetector Configuration for Frontal Depth Camera  
qr_code_detector:
  ros__parameters:
    # Use OAK RGB for QR detection
    image_topic: "/oak/camera/image/raw"
    use_compressed: false
    detection_topic: "/vertical_classification"
    qr_string_topic: "/qr_code_string"
    
    # QR detection parameters
    detection_confidence: 0.8
    max_detection_distance: 5.0
    
    # Debug mode
    debug_mode: true
    debug_topic: "/qr_debug/compressed"
